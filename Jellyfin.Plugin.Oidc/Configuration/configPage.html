<!DOCTYPE html>
<html lang="en">
    <head><meta charset="utf-8"><title data-i18n="pageTitle"></title></head>
<body>
    <div id="OidcConfigPage" data-role="page" class="page type-interior pluginConfigurationPage configPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content"><div class="content-primary"><h1 data-i18n="pageTitle"></h1><form id="OidcConfigForm" class="configForm">
            <div class="checkboxContainer checkboxContainer-withDescription"><label><input id="Enabled" type="checkbox" is="emby-checkbox" /><span>${EnablePlugin} <span data-i18n="protocolName"></span></span></label><div class="fieldDescription checkboxFieldDescription" data-i18n="enabledHelp"></div></div>
            <div class="verticalSection">
                <h2 data-i18n="connectionHeading"></h2>
                <div class="inputContainer inputContainer-withDescription"><input id="PublicUrl" type="url" is="emby-input" data-i18n-label="publicUrlLabel" data-i18n-placeholder="publicUrlPlaceholder" /><div class="fieldDescription" data-i18n="publicUrlHelp"></div></div>
                <div class="inputContainer inputContainer-withDescription"><input id="IssuerUrl" type="url" required is="emby-input" data-i18n-label="issuerUrlLabel" data-i18n-placeholder="issuerUrlPlaceholder" /><div class="fieldDescription" data-i18n="issuerUrlHelp"></div></div>
                <div class="inputContainer inputContainer-withDescription"><input id="ClientId" type="text" required is="emby-input" data-i18n-label="clientIdLabel" /><div class="fieldDescription" data-i18n="clientIdHelp"></div></div>
                <div class="inputContainer inputContainer-withDescription"><label for="ClientSecret" data-i18n="clientSecretLabel"></label><div class="oidc-client-secret" style="align-items: center; display: flex;"><input id="ClientSecret" type="password" required is="emby-input" style="flex: 1; min-width: 0;" /><button id="ClientSecretToggle" type="button" is="emby-button" class="raised cancel" style="align-self: stretch; box-sizing: border-box; margin: 0 0 0 0.5em !important; padding: 0 1em;" data-oidc-client-secret-toggle aria-controls="ClientSecret" aria-label="Show client secret" aria-pressed="false">Show</button></div><div class="fieldDescription" data-i18n="clientSecretHelp"></div></div>
            </div>
            <div class="verticalSection">
                <h2 data-i18n="accessHeading"></h2>
                <div class="inputContainer inputContainer-withDescription"><input id="UserGroup" type="text" is="emby-input" data-i18n-label="userGroupLabel" /><div class="fieldDescription" data-i18n="userGroupHelp"></div></div>
                <div class="inputContainer inputContainer-withDescription"><input id="AdministratorGroup" type="text" is="emby-input" data-i18n-label="administratorGroupLabel" /><div class="fieldDescription" data-i18n="administratorGroupHelp"></div></div>
                <div class="inputContainer inputContainer-withDescription"><input id="GroupClaim" type="text" is="emby-input" data-i18n-label="groupClaimLabel" /><div class="fieldDescription" data-i18n="groupClaimHelp"></div></div>
                <div class="inputContainer inputContainer-withDescription"><input id="AdditionalScopes" type="text" is="emby-input" data-i18n-label="additionalScopesLabel" data-i18n-placeholder="additionalScopesPlaceholder" /><div class="fieldDescription" data-i18n="additionalScopesHelp"></div></div>
            </div>
            <div class="verticalSection">
                <h2>${ButtonSignIn}</h2>
                <div class="inputContainer inputContainer-withDescription"><input id="LoginButtonText" type="text" is="emby-input" placeholder="Sign In with SSO" data-i18n-label="loginButtonTextLabel" /><div class="fieldDescription" data-i18n="loginButtonTextHelp"></div></div>
                <div class="selectContainer"><label for="PasswordLoginMode" data-i18n="passwordLoginModeLabel"></label><select id="PasswordLoginMode" is="emby-select" class="emby-select"><option value="AllowForAllUsers" data-i18n="allowForAllUsers"></option><option value="DisableForLinkedUsersOnly" data-i18n="disableForLinkedUsersOnly"></option><option value="DisableForAllUsers" data-i18n="disableForAllUsers"></option></select><div class="fieldDescription" data-i18n="passwordLoginModeHelp"></div></div>
                <div id="RedirectSignInPageToProviderContainer" class="checkboxContainer checkboxContainer-withDescription" style="display:none"><label><input id="RedirectSignInPageToProvider" type="checkbox" is="emby-checkbox" /><span data-i18n="redirectSignInPageToProviderLabel"></span></label><div class="fieldDescription checkboxFieldDescription" data-i18n="redirectSignInPageToProviderHelp"></div></div>
                <div class="checkboxContainer checkboxContainer-withDescription"><label><input id="SynchronizeProfileImages" type="checkbox" is="emby-checkbox" /><span data-i18n="synchronizeProfileImagesLabel"></span></label><div class="fieldDescription checkboxFieldDescription" data-i18n="synchronizeProfileImagesHelp"></div></div>
                <div class="checkboxContainer checkboxContainer-withDescription"><label><input id="RpInitiatedLogout" type="checkbox" is="emby-checkbox" /><span data-i18n="rpInitiatedLogoutLabel"></span></label><div class="fieldDescription checkboxFieldDescription" data-i18n="rpInitiatedLogoutHelp"></div></div>
            </div>
            <div><button id="SaveButton" is="emby-button" type="submit" class="raised button-submit block" disabled><span>${Save}</span></button></div>
        </form></div></div>
        <script>
            const locale = document.documentElement.lang.toLowerCase();
            const locales = [locale, locale.split('-')[0], 'en-us'].filter((value, index, values) => values.indexOf(value) === index);
            let dictionary;
            const loadDictionary = async () => {
                for (const locale of locales) {
                    const response = await fetch('/oidc/strings/' + encodeURIComponent(locale));
                    if (response.ok) return response.json();
                }

                throw new Error('No OIDC configuration translation dictionary is available.');
            };
            const translate = (key, ...values) => dictionary[key].replace(/\{(\d+)\}/g, (_, index) => values[index]);
            const localize = () => {
                document.title = translate('pageTitle');
                document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = translate(element.dataset.i18n); });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(element => { element.placeholder = translate(element.dataset.i18nPlaceholder); });
                document.querySelectorAll('[data-i18n-label]').forEach(element => {
                    const text = translate(element.dataset.i18nLabel);
                    element.setAttribute('label', text);
                    if (element.labelElement) element.labelElement.textContent = text;
                });
            };

            const pluginId = '4c5b9b96-80cd-4c3d-9e3d-23fa4ebf6ce4';
            const fields = ['Enabled', 'PublicUrl', 'IssuerUrl', 'ClientId', 'ClientSecret', 'UserGroup', 'AdministratorGroup', 'GroupClaim', 'AdditionalScopes', 'LoginButtonText', 'PasswordLoginMode', 'RedirectSignInPageToProvider', 'SynchronizeProfileImages', 'RpInitiatedLogout'];
            const checkboxes = ['Enabled', 'RedirectSignInPageToProvider', 'SynchronizeProfileImages', 'RpInitiatedLogout'];
            let savedConfiguration;
            const value = name => document.querySelector('#' + name)[checkboxes.includes(name) ? 'checked' : 'value'];
            const updateSaveButton = () => { document.querySelector('#SaveButton').disabled = !savedConfiguration || fields.every(name => value(name) === savedConfiguration[name]); };
            const updateRedirectSignInPageToProvider = () => { document.querySelector('#RedirectSignInPageToProviderContainer').style.display = value('PasswordLoginMode') === 'DisableForAllUsers' ? '' : 'none'; };
            const loadConfiguration = () => ApiClient.getPluginConfiguration(pluginId).then(config => {
                savedConfiguration = Object.fromEntries(fields.map(name => [name, name === 'LoginButtonText' && config[name] === 'Sign In with SSO' ? '' : config[name]]));
                fields.forEach(name => { document.querySelector('#' + name)[checkboxes.includes(name) ? 'checked' : 'value'] = name === 'LoginButtonText' && config[name] === 'Sign In with SSO' ? '' : config[name]; }); updateRedirectSignInPageToProvider(); updateSaveButton();
            });
            document.querySelector('#OidcConfigPage').addEventListener('pageshow', () => {
                if (dictionary) localize();
                loadConfiguration();
            });
            const form = document.querySelector('#OidcConfigForm');
            const validateGroups = () => {
                const userGroup = document.querySelector('#UserGroup');
                userGroup.setCustomValidity(userGroup.value.trim() || document.querySelector('#AdministratorGroup').value.trim() ? '' : translate('groupValidation'));
            };
            const validateHttpsUrl = name => {
                const input = document.querySelector('#' + name);
                try {
                    input.setCustomValidity(!input.value || new URL(input.value).protocol === 'https:' ? '' : dictionary ? translate('httpsUrlValidation') : 'Enter an HTTPS URL.');
                } catch {
                    input.setCustomValidity(dictionary ? translate('httpsUrlValidation') : 'Enter an HTTPS URL.');
                }
            };
            const clientSecret = document.querySelector('#ClientSecret');
            const clientSecretToggle = document.querySelector('#ClientSecretToggle');
            const updateClientSecretToggle = () => {
                const visible = clientSecret.type === 'text';
                const text = dictionary ? translate(visible ? 'hideClientSecret' : 'showClientSecret') : visible ? 'Hide' : 'Show';
                clientSecretToggle.setAttribute('aria-label', text + ' ' + (dictionary ? translate('clientSecretLabel') : 'client secret'));
                clientSecretToggle.setAttribute('aria-pressed', visible);
                clientSecretToggle.textContent = text;
            };
            clientSecretToggle.addEventListener('click', () => {
                clientSecret.type = clientSecret.type === 'password' ? 'text' : 'password';
                updateClientSecretToggle();
            });
            const save = () => {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(config => {
                    fields.forEach(name => { config[name] = value(name); });
                    return ApiClient.updatePluginConfiguration(pluginId, config);
                }).then(result => {
                    const reload = ['Enabled', 'PasswordLoginMode', 'RedirectSignInPageToProvider'].some(name => value(name) !== savedConfiguration[name]);
                    savedConfiguration = Object.fromEntries(fields.map(name => [name, value(name)]));
                    updateSaveButton();
                    return Promise.resolve(Dashboard.processPluginConfigurationUpdateResult(result)).then(() => reload ? location.reload() : dispatchEvent(new Event('oidcconfigurationchange')));
                });
            };
            form.addEventListener('submit', event => {
                event.preventDefault();
                validateGroups();
                validateHttpsUrl('PublicUrl');
                validateHttpsUrl('IssuerUrl');
                if (!form.reportValidity()) return;
                const mode = value('PasswordLoginMode');
                if (mode !== savedConfiguration.PasswordLoginMode && mode !== 'AllowForAllUsers') {
                    const users = mode === 'DisableForAllUsers' ? translate('allJellyfinUsers') : translate('linkedJellyfinUsers');
                    Dashboard.confirm(translate('localPasswordWarning', users), translate('localPasswordWarningTitle'), confirmed => { if (confirmed) save(); });
                    return;
                }
                save();
            });
            fields.forEach(name => document.querySelector('#' + name).addEventListener('input', updateSaveButton));
            fields.forEach(name => document.querySelector('#' + name).addEventListener('change', updateSaveButton));
            document.querySelector('#PasswordLoginMode').addEventListener('change', updateRedirectSignInPageToProvider);
            ['PublicUrl', 'IssuerUrl'].forEach(name => document.querySelector('#' + name).addEventListener('input', () => validateHttpsUrl(name)));
            document.querySelector('#UserGroup').addEventListener('input', validateGroups);
            document.querySelector('#AdministratorGroup').addEventListener('input', validateGroups);
            loadDictionary().then(strings => { dictionary = strings; localize(); updateClientSecretToggle(); loadConfiguration(); });
        </script>
    </div>
</body>
</html>

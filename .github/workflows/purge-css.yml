name: Purge CSS Cache

on:
  push:
    branches:
      - main
    paths:
      - "assets/**/*.css"

permissions: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          for css in assets/*.css; do
            curl --fail --retry 3 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$css"
          done

name: Purge CSS Cache

on:
  push:
    branches:
      - main
    paths:
      - "assets/**/*.css"

permissions: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          for css in assets/*.css; do
            curl --fail --retry 3 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$css"
          done

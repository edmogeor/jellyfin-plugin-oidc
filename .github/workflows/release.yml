name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - run: make check
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: make test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must use vX.Y.Z.W, received %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - id: package
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d
        with:
          dotnet-target: net10.0
          output: dist
          version: ${{ steps.version.outputs.value }}
      - run: md5sum dist/*.zip > dist/plugin.md5
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/plugin.md5 --generate-notes --title "OIDC Authentication ${{ steps.version.outputs.value }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Kevinjil/jellyfin-plugin-repo-action@a7832ecc44c6b1a45d531970f6647b8682b005b8
        with:
          githubToken: ${{ github.token }}
          repository: ${{ github.repository }}
          pagesBranch: manifest-release
          pagesFile: manifest.json
          ignorePrereleases: true

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - run: make check
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: make test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must use vX.Y.Z.W, received %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
      - name: Add release notes to plugin manifest
        run: |
          python3 -c 'from pathlib import Path; import json; path = Path("build.yaml"); config = path.read_text(); placeholder = "changelog: \"\""; assert config.count(placeholder) == 1; path.write_text(config.replace(placeholder, "changelog: {}".format(json.dumps(Path("release-notes.md").read_text().strip()))))'
      - id: package
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d
        with:
          dotnet-target: net10.0
          output: dist
          version: ${{ steps.version.outputs.value }}
      - run: md5sum dist/*.zip > dist/plugin.md5
      - run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" dist/*.zip dist/plugin.md5 --notes-file release-notes.md --title "OIDC Authentication ${{ steps.version.outputs.value }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: Kevinjil/jellyfin-plugin-repo-action@296850372cd569cbcc040e834222a5afed861485
        with:
          githubToken: ${{ github.token }}
          repository: ${{ github.repository }}
          pagesBranch: manifest-release
          pagesFile: manifest.json
          ignorePrereleases: true
